name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run foundation tests
        run: python -m unittest discover -s tests -v
      - name: Generate survivability matrix
        run: python tools/survivability_matrix.py > /tmp/generation_matrix.json
      - name: Assert matrix is valid JSON
        run: python -m json.tool /tmp/generation_matrix.json > /dev/null
      - name: Generate lineage readiness
        run: python tools/lineage_readiness.py > /tmp/lineage_readiness.json
      - name: Assert lineage readiness is valid JSON
        run: python -m json.tool /tmp/lineage_readiness.json > /dev/null
      - name: Generate chain experiment readiness
        run: python tools/chain_experiment_readiness.py > /tmp/chain_experiment_readiness.json
      - name: Assert chain experiment readiness is valid JSON
        run: python -m json.tool /tmp/chain_experiment_readiness.json > /dev/null
      - name: Generate evidence reference integrity
        run: python tools/evidence_reference_integrity.py > /tmp/evidence_reference_integrity.json
      - name: Assert evidence reference integrity is valid JSON
        run: python -m json.tool /tmp/evidence_reference_integrity.json > /dev/null
      - name: Generate evidence reference resolution
        run: python tools/evidence_reference_resolution.py > /tmp/evidence_reference_resolution.json
      - name: Assert evidence reference resolution is valid JSON
        run: python -m json.tool /tmp/evidence_reference_resolution.json > /dev/null
      - name: Generate evidence donor binding
        run: python tools/evidence_donor_binding.py > /tmp/evidence_donor_binding.json
      - name: Assert evidence donor binding is valid JSON
        run: python -m json.tool /tmp/evidence_donor_binding.json > /dev/null
      - name: Generate admitted evidence role binding
        run: python tools/evidence_reference_roles.py > /tmp/evidence_reference_roles.json
      - name: Assert admitted evidence role binding is valid JSON
        run: python -m json.tool /tmp/evidence_reference_roles.json > /dev/null
      - name: Generate monolith candidate census
        run: python tools/monolith_candidate_census.py > /tmp/monolith_candidate_census.json
      - name: Assert monolith candidate census is valid JSON
        run: python -m json.tool /tmp/monolith_candidate_census.json > /dev/null
      - name: Generate candidate promotion readiness
        run: python tools/candidate_promotion_readiness.py > /tmp/candidate_promotion_readiness.json
      - name: Assert candidate promotion readiness is valid JSON
        run: python -m json.tool /tmp/candidate_promotion_readiness.json > /dev/null
      - name: Generate historical fixture route evidence
        run: python tools/historical_fixture_routes.py > /tmp/historical_fixture_routes.json
      - name: Assert historical fixture route evidence is valid JSON
        run: python -m json.tool /tmp/historical_fixture_routes.json > /dev/null
      - name: Generate artifact path-history evidence
        run: python tools/artifact_path_history.py > /tmp/artifact_path_history.json
      - name: Assert artifact path-history evidence is valid JSON
        run: python -m json.tool /tmp/artifact_path_history.json > /dev/null
      - name: Generate historical fixture route-generation binding evidence
        run: python tools/historical_fixture_generation_binding.py > /tmp/historical_fixture_generation_binding.json
      - name: Assert historical fixture route-generation binding evidence is valid JSON
        run: python -m json.tool /tmp/historical_fixture_generation_binding.json > /dev/null
      - name: Generate historical fixture evidence closure
        run: python tools/historical_evidence_closure.py > /tmp/historical_evidence_closure.json
      - name: Assert historical fixture evidence closure is valid JSON
        run: python -m json.tool /tmp/historical_evidence_closure.json > /dev/null
      - name: Generate admitted-path execution evidence
        run: python tools/path_execution_evidence.py > /tmp/path_execution_evidence.json
      - name: Assert admitted-path execution evidence is valid JSON
        run: python -m json.tool /tmp/path_execution_evidence.json > /dev/null

  replay-framestate-v04-v05:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Protocol Evolution
        uses: actions/checkout@v4
        with:
          path: protocol-evolution
      - name: Checkout exact FrameState donor snapshot
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-framestate
          ref: 60ea68ba72e4ad4df8dc5746c6bb18fcd6569a34
          path: donor/framestate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay admitted FrameState v0.4 -> v0.5 path
        working-directory: protocol-evolution
        run: python tools/replay_framestate_v04_v05.py --donor-root ../donor/framestate
