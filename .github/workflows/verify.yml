name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run foundation tests
        run: python -m unittest discover -s tests -v
      - name: Generate survivability matrix
        run: python tools/survivability_matrix.py > /tmp/generation_matrix.json
      - name: Assert matrix is valid JSON
        run: python -m json.tool /tmp/generation_matrix.json > /dev/null
